name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version: ['27.1', '28.2', '29.4', '30.1', 'snapshot']
    steps:
      - uses: actions/checkout@v4
        with:
          path: flymake-jev.el
      - name: Check out jev.el, which this package is built on
        uses: actions/checkout@v4
        with:
          repository: wakamenod/jev.el
          path: jev.el
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}
      - name: Byte-compile
        run: make compile JEV=../jev.el
        working-directory: flymake-jev.el
      - name: Test
        run: make test JEV=../jev.el
        working-directory: flymake-jev.el
